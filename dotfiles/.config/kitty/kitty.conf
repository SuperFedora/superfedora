# --- Kitty Configuration (Configured to match foot) ---

# Font configuration
font_family      Adwaita Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# Window layout & padding
window_padding_width    10
placement_strategy      center
remember_window_size    no
initial_window_width    100c
initial_window_height   28c

# Window decorations (Removes the header / title bar entirely)
hide_window_decorations yes
wayland_titlebar_color  background

# Scrollback
scrollback_lines 10000

# Cursor
cursor_shape               block
cursor_blink_interval      -1
cursor_stop_blinking_after 0
shell_integration          no-cursor

# Bell
enable_audio_bell no

# Window close behavior
confirm_os_window_close 0

# Key bindings
map super+alt+f toggle_fullscreen

# Native Fedora / GNOME Adwaita Dark palette (clean neutral dark, no blue tint)
foreground            #deddda
background            #1e1e1e
selection_foreground   none
selection_background   #3584e4

# Cursor colors
cursor                #deddda
cursor_text_color     #1e1e1e

# Normal colors
color0                #1e1e1e
color1                #c01c28
color2                #26a269
color3                #a2734c
color4                #12488b
color5                #a347ba
color6                #2aa1b3
color7                #deddda

# Bright colors
color8                #5e5c64
color9                #ed333b
color10               #57e389
color11               #f6d32d
color12               #3584e4
color13               #c061cb
color14               #33c7de
color15               #ffffff

# --- No internal tiling: let Hyprland manage windows ---
# Only one kitty pane is ever shown per OS window
enabled_layouts stack
# "New window" opens a separate OS window that Hyprland tiles
map ctrl+shift+enter new_os_window_with_cwd
map ctrl+shift+n     new_os_window_with_cwd
# Disable split/tab/layout shortcuts
map ctrl+shift+t     no_op
map ctrl+shift+l     no_op
map ctrl+shift+]     no_op
map ctrl+shift+[     no_op
map ctrl+shift+f     no_op
map ctrl+shift+b     no_op
map ctrl+shift+r     no_op
map ctrl+shift+w     no_op
map ctrl+shift+q     no_op
map ctrl+shift+right no_op
map ctrl+shift+left  no_op
tab_bar_style hidden
