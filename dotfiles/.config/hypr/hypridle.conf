# Hypridle — drives IdleScreen on Hyprland.
# hypridle owns org.freedesktop.ScreenSaver, so apps that inhibit idle
# (video players, browsers in fullscreen video, calls) pause every step below.

general {
    # Stop the screensaver first so it never renders under the lock screen or consumes energy
    lock_cmd = PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH" idlescreen stop >/dev/null 2>&1; qs ipc --any-display call lock activate >/dev/null 2>&1 || (pidof hyprlock || { hyprlock --immediate-render --no-fade-in && rm -f "${XDG_RUNTIME_DIR:-/run/user/$(id -u)}/superfedora.locked"; })
    unlock_cmd = rm -f "${XDG_RUNTIME_DIR:-/run/user/$(id -u)}/superfedora.locked"; PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH" idlescreen stop >/dev/null 2>&1; qs ipc --any-display call lock unlock >/dev/null 2>&1 || true
    before_sleep_cmd = PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH" idlescreen stop >/dev/null 2>&1; ~/.config/hypr/scripts/toggle-touchpad.sh dpms off >/dev/null 2>&1; loginctl lock-session
    after_sleep_cmd = ~/.config/hypr/scripts/toggle-touchpad.sh dpms on
    ignore_dbus_inhibit = false
}

# 1. Screensaver after 2 minutes
listener {
    timeout = 120
    on-timeout = [ ! -f "$HOME/.config/superfedora/stay-awake" ] && [ ! -f "${XDG_RUNTIME_DIR:-/run/user/$(id -u)}/superfedora.locked" ] && ! pidof hyprlock >/dev/null && PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH" idlescreen start --on-idle
    on-resume = PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH" idlescreen stop
}

# 2. Lock after 5 minutes (runs in 'poweroff' and 'lock' modes; skipped in 'screensaver' mode, stay-awake, or active media/inhibitors)
listener {
    timeout = 300
    on-timeout = [ ! -f "$HOME/.config/superfedora/stay-awake" ] && [ "$(cat "$HOME/.config/superfedora/idle-mode" 2>/dev/null || echo poweroff)" != "screensaver" ] && [ "$(PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH" idlescreen inhibitors --json 2>/dev/null || echo '[]')" = "[]" ] && { PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH" idlescreen stop >/dev/null 2>&1; loginctl lock-session; }
}

# 3. Screen + keyboard lights off after 10 minutes (runs only in 'poweroff' mode; skipped in 'lock'/'screensaver' modes or active media/inhibitors)
listener {
    timeout = 600
    on-timeout = [ ! -f "$HOME/.config/superfedora/stay-awake" ] && [ "$(cat "$HOME/.config/superfedora/idle-mode" 2>/dev/null || echo poweroff)" = "poweroff" ] && [ "$(PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH" idlescreen inhibitors --json 2>/dev/null || echo '[]')" = "[]" ] && ~/.config/hypr/scripts/toggle-touchpad.sh dpms off
    on-resume = ~/.config/hypr/scripts/toggle-touchpad.sh dpms on
}

# 4. Suspend after 30 minutes on battery only (runs only in 'poweroff' mode; skipped when media/inhibitors are active)
listener {
    timeout = 1800
    on-timeout = [ ! -f "$HOME/.config/superfedora/stay-awake" ] && [ "$(cat "$HOME/.config/superfedora/idle-mode" 2>/dev/null || echo poweroff)" = "poweroff" ] && [ "$(cat /sys/class/power_supply/AC/online 2>/dev/null)" = "0" ] && [ "$(PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH" idlescreen inhibitors --json 2>/dev/null || echo '[]')" = "[]" ] && systemctl suspend
}
