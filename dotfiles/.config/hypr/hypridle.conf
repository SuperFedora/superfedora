# Hypridle — drives IdleScreen on Hyprland.
# hypridle owns org.freedesktop.ScreenSaver, so apps that inhibit idle
# (video players, browsers in fullscreen video, calls) pause every step below.

general {
    # Stop the screensaver first so it doesn't keep rendering under the lock screen
    lock_cmd = idlescreen stop >/dev/null 2>&1; pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
}

# 1. Screensaver after 2 minutes
listener {
    timeout = 120
    on-timeout = idlescreen start
    on-resume = idlescreen stop
}

# 2. Lock after 5 minutes
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 3. Screen off after 10 minutes
listener {
    timeout = 600
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# 4. Suspend after 30 minutes on battery only
listener {
    timeout = 1800
    on-timeout = [ "$(cat /sys/class/power_supply/AC/online 2>/dev/null)" = "0" ] && systemctl suspend
}
