# Hypridle — drives IdleScreen on Hyprland.
# hypridle owns org.freedesktop.ScreenSaver, so apps that inhibit idle
# (video players, browsers in fullscreen video, calls) pause every step below.

general {
    # Stop the screensaver first so it never renders under the lock screen or consumes energy
    lock_cmd = PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH" idlescreen stop >/dev/null 2>&1; pidof hyprlock || hyprlock --immediate-render --no-fade-in
    unlock_cmd = PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH" idlescreen stop >/dev/null 2>&1
    before_sleep_cmd = PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH" idlescreen stop >/dev/null 2>&1; loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
}

# 1. Screensaver after 2 minutes
listener {
    timeout = 120
    on-timeout = pidof hyprlock >/dev/null || PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH" idlescreen start
    on-resume = PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH" idlescreen stop
}

# 2. Lock after 5 minutes
listener {
    timeout = 300
    on-timeout = PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH" idlescreen stop >/dev/null 2>&1; loginctl lock-session
}

# 3. Screen off after 10 minutes
listener {
    timeout = 600
    on-timeout = PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH" idlescreen stop >/dev/null 2>&1; hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# 4. Suspend after 30 minutes on battery only
listener {
    timeout = 1800
    on-timeout = [ "$(cat /sys/class/power_supply/AC/online 2>/dev/null)" = "0" ] && systemctl suspend
}
