# Window rules (Hyprland 0.53+ syntax)

# Never let apps maximize themselves
windowrule = match:class .*, suppress_event maximize

# Floating utility windows
windowrule = match:class ^(org.pulseaudio.pavucontrol)$, float on
windowrule = match:class ^(nm-connection-editor)$, float on
windowrule = match:class ^(blueman-manager)$, float on
windowrule = match:class ^(org.gnome.Calculator)$, float on
windowrule = match:class ^(xdg-desktop-portal-gtk)$, float on
windowrule = match:class ^(hyprland-share-picker)$, float on
windowrule = match:title ^(Picture-in-Picture)$, float on
windowrule = match:title ^(Picture-in-Picture)$, pin on
windowrule = match:class ^(org.gnome.Nautilus)$, match:title ^(.*Properties.*)$, float on

# Floating terminal popups launched by the menu (btop, etc.)
windowrule = match:class ^(floating-term)$, float on
windowrule = match:class ^(floating-term)$, size 1100 700
windowrule = match:class ^(floating-term)$, center on

# Quake-style drop-down AI console (SUPER + grave -> Antigravity CLI)
windowrule = match:class ^(quake-ai)$, float on
windowrule = match:class ^(quake-ai)$, workspace special:ai
windowrule = match:class ^(quake-ai)$, no_anim on
windowrule = match:class ^(quake-ai)$, border_size 0
windowrule = match:class ^(quake-ai)$, no_shadow on
windowrule = match:class ^(quake-ai)$, rounding 0
windowrule = match:class ^(quake-ai)$, size 1056 400
layerrule = match:namespace ^(superfedora-superdeck)$, no_anim on
layerrule = match:namespace ^(superfedora-settings)$, no_anim on

# Slight transparency on terminals, like Omarchy
windowrule = match:class ^(kitty)$, opacity 0.97 0.92
windowrule = match:class ^(quake-ai)$, opacity 1.0 1.0

# IdleScreen screensaver fullscreen and overlay rules
windowrule = match:class ^(idlescreen)$, fullscreen on
windowrule = match:class ^(idlescreen)$, float on
layerrule = match:namespace ^(idlescreen)$, no_anim on
layerrule = match:namespace ^(screensaver)$, no_anim on
