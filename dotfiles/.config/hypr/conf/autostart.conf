# Autostart
# Export the session environment to systemd/D-Bus, then start
# hyprland-session.target and superfedora-session.target, which activate
# graphical-session.target, portals, supershell, hyprpolkitagent, hypridle,
# hyprpaper, idlescreen, cliphist, and background timers.
exec-once = systemd-tmpfiles --user --create >/dev/null 2>&1 || true; gnome-keyring-daemon --start --components=secrets,ssh >/dev/null 2>&1 || true; systemctl --user reset-failed; dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE XDG_SESSION_DESKTOP HYPRLAND_INSTANCE_SIGNATURE PATH QT_QPA_PLATFORM QT_QPA_PLATFORMTHEME QT_WAYLAND_DISABLE_WINDOWDECORATION QT_AUTO_SCREEN_SCALE_FACTOR GDK_BACKEND XCURSOR_THEME XCURSOR_SIZE HYPRCURSOR_SIZE && systemctl --user start hyprland-session.target superfedora-session.target
exec-shutdown = rm -f "${XDG_RUNTIME_DIR:-/run/user/$(id -u)}/superfedora.locked"; systemctl --user stop superfedora-session.target hyprland-session.target; systemctl --user reset-failed

# Dismiss compositor startup banner & play 16-bit SNES startup chime
exec-once = (for _ in 1 2 3 4 5; do hyprctl dismissnotify >/dev/null 2>&1 || true; sleep 0.08; done) & ~/.local/bin/supertheme sfx play startup || ~/.local/bin/superfedora sfx play startup
