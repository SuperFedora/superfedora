# Autostart
# Export the session environment to systemd/D-Bus, then start
# hyprland-session.target, which activates graphical-session.target. Portals
# and idlescreen.service depend on it.
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE XDG_SESSION_DESKTOP HYPRLAND_INSTANCE_SIGNATURE PATH && systemctl --user start hyprland-session.target
exec-shutdown = systemctl --user stop hyprland-session.target
exec-once = /usr/libexec/hyprpolkitagent || hyprpolkitagent

# Bar, notifications (Quickshell), idle, wallpaper
exec-once = quickshell
exec-once = hypridle
exec-once = hyprpaper
