# Autostart
# Export the session environment to systemd/D-Bus, then start
# hyprland-session.target, which activates graphical-session.target. Portals
# and idlescreen.service depend on it.
exec-once = systemctl --user reset-failed; dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE XDG_SESSION_DESKTOP HYPRLAND_INSTANCE_SIGNATURE PATH && systemctl --user start hyprland-session.target
exec-shutdown = rm -f "${XDG_RUNTIME_DIR:-/run/user/$(id -u)}/superfedora.locked"; systemctl --user stop hyprland-session.target; systemctl --user reset-failed
exec-once = /usr/libexec/hyprpolkitagent || hyprpolkitagent

# Bar, notifications (Quickshell), idle, wallpaper
exec-once = rm -f "${XDG_RUNTIME_DIR:-/run/user/$(id -u)}/superfedora.locked"; quickshell
exec-once = hypridle
exec-once = hyprpaper
