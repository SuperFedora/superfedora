# Autostart
# Export the session environment to systemd/D-Bus, then start
# hyprland-session.target and superfedora-session.target, which activate
# graphical-session.target, portals, supershell, superagent, and idlescreen.
exec-once = systemd-tmpfiles --user --create >/dev/null 2>&1 || true; systemctl --user reset-failed; dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE XDG_SESSION_DESKTOP HYPRLAND_INSTANCE_SIGNATURE PATH && systemctl --user start hyprland-session.target superfedora-session.target
exec-shutdown = rm -f "${XDG_RUNTIME_DIR:-/run/user/$(id -u)}/superfedora.locked"; systemctl --user stop superfedora-session.target hyprland-session.target; systemctl --user reset-failed
exec-once = /usr/libexec/hyprpolkitagent || hyprpolkitagent

# Bar, notifications (Quickshell), idle, wallpaper, and 16-bit SNES startup chime
exec-once = rm -f "${XDG_RUNTIME_DIR:-/run/user/$(id -u)}/superfedora.locked"; quickshell
exec-once = hypridle
exec-once = hyprpaper
exec-once = ~/.local/bin/superfedora sfx play startup || ~/.local/share/superfedora/lib/sfx.sh play startup; (sleep 0.7 && ~/.local/bin/superfedora notify --banner ready >/dev/null 2>&1) &

# Background sync & desktop services (cliphist clipboard history, udiskie mounts, Synology Drive)
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = udiskie --no-automount --smart-tray >/dev/null 2>&1 || true
exec-once = ~/.local/bin/synology-drive start || /opt/Synology/SynologyDrive/bin/launcher
