# Input
input {
    kb_layout = us
    kb_options = compose:caps
    repeat_rate = 40
    repeat_delay = 250

    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
        scroll_factor = 0.4
        clickfinger_behavior = true
    }
}

# Touchpad gestures
gesture = 3, horizontal, workspace          # 3-finger swipe left/right: switch workspace
gesture = 3, up, special, scratchpad        # 3-finger swipe up: toggle scratchpad
gesture = 4, up, fullscreen                 # 4-finger swipe up: fullscreen
gesture = 4, down, float                    # 4-finger swipe down: toggle floating

gestures {
    workspace_swipe_distance = 300
    workspace_swipe_cancel_ratio = 0.15
    workspace_swipe_forever = true
    workspace_swipe_create_new = true
}
