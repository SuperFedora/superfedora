# Default applications
$terminal    = xdg-terminal-exec
$fileManager = xdg-terminal-exec --files
$browser     = xdg-terminal-exec --browser
$launcher    = fuzzel
$scripts     = ~/.config/hypr/scripts

# PATH: the login session starts Hyprland without ~/.local/bin or ~/.cargo/bin,
# which breaks exec binds for user-installed tools (kitty, cargo TUIs, idlescreen).
env = PATH,$HOME/.local/bin:$HOME/.cargo/bin:$HOME/bin:/usr/local/bin:/usr/bin:/usr/local/sbin:/usr/sbin

# Session
env = XDG_CURRENT_DESKTOP,Hyprland:SuperFedora
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# Toolkits
env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,hyprqt6engine
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,auto

# Cursor
env = XCURSOR_THEME,Adwaita
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
