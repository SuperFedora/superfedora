# Super Fedora — keybindings
# Mirrors COSMIC's compositor defaults (pop-os/cosmic-comp data/keybindings.ron)
# entry for entry. Extras that COSMIC doesn't define live at the bottom on keys
# COSMIC leaves free. All described binds are listed with SUPER+F1.
#
# bindd = MODS, KEY, Description, dispatcher, args

# ═══ COSMIC: session ═════════════════════════════════════════════════════
bindd = SUPER, Escape, Lock screen, exec, loginctl lock-session
bindd = SUPER SHIFT, Escape, Log out / power menu, exec, $scripts/menu.sh system
bindd = SUPER ALT, Escape, Exit Hyprland, exit,
bindd = SUPER CTRL, Escape, Debug: reload config, exec, hyprctl reload

# ═══ COSMIC: close ═══════════════════════════════════════════════════════
bindd = SUPER, Q, Close window, killactive,
bindd = ALT, F4, Close window, killactive,

# ═══ COSMIC: focus (stack-aware, like COSMIC) ════════════════════════════
bindd = SUPER, left, Focus left, exec, $scripts/focus.sh l
bindd = SUPER, right, Focus right, exec, $scripts/focus.sh r
bindd = SUPER, up, Focus up, exec, $scripts/focus.sh u
bindd = SUPER, down, Focus down, exec, $scripts/focus.sh d
bindd = SUPER, H, Focus left, exec, $scripts/focus.sh l
bindd = SUPER, J, Focus down, exec, $scripts/focus.sh d
bindd = SUPER, K, Focus up, exec, $scripts/focus.sh u
bindd = SUPER, L, Focus right, exec, $scripts/focus.sh r
# Focus Out / In walk the tiling tree in COSMIC; nearest Hyprland equivalent
# is cycling through windows on the workspace.
bindd = SUPER, U, Focus out (previous window), cyclenext, prev
bindd = SUPER, I, Focus in (next window), cyclenext,

# ═══ COSMIC: move window (joins/leaves stacks like COSMIC) ═══════════════
bindd = SUPER SHIFT, left, Move window left, movewindoworgroup, l
bindd = SUPER SHIFT, right, Move window right, movewindoworgroup, r
bindd = SUPER SHIFT, up, Move window up, movewindoworgroup, u
bindd = SUPER SHIFT, down, Move window down, movewindoworgroup, d
bindd = SUPER SHIFT, H, Move window left, movewindoworgroup, l
bindd = SUPER SHIFT, J, Move window down, movewindoworgroup, d
bindd = SUPER SHIFT, K, Move window up, movewindoworgroup, u
bindd = SUPER SHIFT, L, Move window right, movewindoworgroup, r

# ═══ COSMIC: workspaces ══════════════════════════════════════════════════
bindd = SUPER, 1, Workspace 1, workspace, 1
bindd = SUPER, 2, Workspace 2, workspace, 2
bindd = SUPER, 3, Workspace 3, workspace, 3
bindd = SUPER, 4, Workspace 4, workspace, 4
bindd = SUPER, 5, Workspace 5, workspace, 5
bindd = SUPER, 6, Workspace 6, workspace, 6
bindd = SUPER, 7, Workspace 7, workspace, 7
bindd = SUPER, 8, Workspace 8, workspace, 8
bindd = SUPER, 9, Workspace 9, workspace, 9
bindd = SUPER, 0, Last (empty) workspace, workspace, empty

bindd = SUPER SHIFT, 1, Move window to workspace 1, movetoworkspace, 1
bindd = SUPER SHIFT, 2, Move window to workspace 2, movetoworkspace, 2
bindd = SUPER SHIFT, 3, Move window to workspace 3, movetoworkspace, 3
bindd = SUPER SHIFT, 4, Move window to workspace 4, movetoworkspace, 4
bindd = SUPER SHIFT, 5, Move window to workspace 5, movetoworkspace, 5
bindd = SUPER SHIFT, 6, Move window to workspace 6, movetoworkspace, 6
bindd = SUPER SHIFT, 7, Move window to workspace 7, movetoworkspace, 7
bindd = SUPER SHIFT, 8, Move window to workspace 8, movetoworkspace, 8
bindd = SUPER SHIFT, 9, Move window to workspace 9, movetoworkspace, 9
bindd = SUPER SHIFT, 0, Move window to last (empty) workspace, movetoworkspace, empty

bindd = SUPER CTRL, left, Previous workspace, workspace, r-1
bindd = SUPER CTRL, up, Previous workspace, workspace, r-1
bindd = SUPER CTRL, right, Next workspace, workspace, r+1
bindd = SUPER CTRL, down, Next workspace, workspace, r+1
bindd = SUPER CTRL, H, Previous workspace, workspace, r-1
bindd = SUPER CTRL, K, Previous workspace, workspace, r-1
bindd = SUPER CTRL, L, Next workspace, workspace, r+1
bindd = SUPER CTRL, J, Next workspace, workspace, r+1

bindd = SUPER CTRL SHIFT, left, Move window to previous workspace, movetoworkspace, r-1
bindd = SUPER CTRL SHIFT, up, Move window to previous workspace, movetoworkspace, r-1
bindd = SUPER CTRL SHIFT, right, Move window to next workspace, movetoworkspace, r+1
bindd = SUPER CTRL SHIFT, down, Move window to next workspace, movetoworkspace, r+1
bindd = SUPER CTRL SHIFT, H, Move window to previous workspace, movetoworkspace, r-1
bindd = SUPER CTRL SHIFT, K, Move window to previous workspace, movetoworkspace, r-1
bindd = SUPER CTRL SHIFT, L, Move window to next workspace, movetoworkspace, r+1
bindd = SUPER CTRL SHIFT, J, Move window to next workspace, movetoworkspace, r+1

# ═══ COSMIC: monitors (outputs) ══════════════════════════════════════════
bindd = SUPER ALT, left, Focus monitor left, focusmonitor, l
bindd = SUPER ALT, right, Focus monitor right, focusmonitor, r
bindd = SUPER ALT, up, Focus monitor up, focusmonitor, u
bindd = SUPER ALT, down, Focus monitor down, focusmonitor, d
bindd = SUPER ALT, H, Focus monitor left, focusmonitor, l
bindd = SUPER ALT, L, Focus monitor right, focusmonitor, r
bindd = SUPER ALT, K, Focus monitor up, focusmonitor, u
bindd = SUPER ALT, J, Focus monitor down, focusmonitor, d

bindd = SUPER SHIFT ALT, left, Move window to monitor left, movewindow, mon:l
bindd = SUPER SHIFT ALT, right, Move window to monitor right, movewindow, mon:r
bindd = SUPER SHIFT ALT, up, Move window to monitor up, movewindow, mon:u
bindd = SUPER SHIFT ALT, down, Move window to monitor down, movewindow, mon:d
bindd = SUPER SHIFT ALT, H, Move window to monitor left, movewindow, mon:l
bindd = SUPER SHIFT ALT, L, Move window to monitor right, movewindow, mon:r
bindd = SUPER SHIFT ALT, K, Move window to monitor up, movewindow, mon:u
bindd = SUPER SHIFT ALT, J, Move window to monitor down, movewindow, mon:d

# ═══ COSMIC: tiling & window state ═══════════════════════════════════════
bindd = SUPER, O, Toggle orientation, layoutmsg, togglesplit
bindd = SUPER, S, Toggle stacking, togglegroup,
bindd = SUPER, Y, Toggle tiling on workspace, exec, $scripts/toggle-tiling.sh
bindd = SUPER, G, Toggle floating window, togglefloating,
bindd = SUPER, X, Swap window (then arrow), submap, swap
bindd = SUPER, M, Maximize, fullscreen, 1
bindd = SUPER, F11, Fullscreen, fullscreen, 0
bindd = SUPER, R, Resize mode (grow), submap, resize
bindd = SUPER SHIFT, R, Resize mode (shrink), submap, resize

# ═══ COSMIC: accessibility ═══════════════════════════════════════════════
bindd = SUPER ALT, S, Toggle screen reader, exec, $scripts/menu.sh toggle-screenreader
bindd = SUPER, equal, Zoom in, exec, $scripts/zoom.sh in
bindd = SUPER, minus, Zoom out, exec, $scripts/zoom.sh out
bindd = SUPER, period, Zoom in, exec, $scripts/zoom.sh in
bindd = SUPER, comma, Zoom out, exec, $scripts/zoom.sh out

# ═══ COSMIC: system actions ══════════════════════════════════════════════
bindd = SUPER, B, Web browser, exec, $browser
bindd = SUPER, F, Home folder, exec, $fileManager
bindd = SUPER, Space, Switch keyboard layout, exec, hyprctl switchxkblayout all next
bindd = SUPER, T, Terminal, exec, $terminal
bindd = SUPER, A, App library, exec, $launcher
bindd = SUPER, W, Workspace / window overview, exec, $scripts/windows.sh
bindd = SUPER, slash, Launcher, exec, $launcher
bindrd = SUPER, SUPER_L, Launcher (tap Super), exec, $launcher
bindd = ALT, Tab, Window switcher, cyclenext,
bindd = ALT SHIFT, Tab, Window switcher (previous), cyclenext, prev
bindd = SUPER, Tab, Window switcher, cyclenext,
bindd = SUPER SHIFT, Tab, Window switcher (previous), cyclenext, prev
bind = ALT, Tab, bringactivetotop,
bind = SUPER, Tab, bringactivetotop,
bindd = , Print, Screenshot, exec, $scripts/screenshot.sh region

# ═══ COSMIC: hardware keys ═══════════════════════════════════════════════
bindeld = , XF86AudioRaiseVolume, Volume up, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindeld = , XF86AudioLowerVolume, Volume down, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindld = , XF86AudioMute, Mute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindld = , XF86AudioMicMute, Mute microphone, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindeld = , XF86MonBrightnessUp, Brightness up, exec, brightnessctl -e4 -n2 set 5%+
bindeld = , XF86MonBrightnessDown, Brightness down, exec, brightnessctl -e4 -n2 set 5%-
bindld = , XF86AudioPlay, Play / pause, exec, playerctl play-pause
bindld = , XF86AudioPrev, Previous track, exec, playerctl previous
bindld = , XF86AudioNext, Next track, exec, playerctl next
bindd = , XF86PowerOff, Power menu, exec, $scripts/menu.sh system
bindd = , XF86TouchpadToggle, Toggle touchpad, exec, $scripts/toggle-touchpad.sh
bindd = SUPER CTRL, XF86TouchpadToggle, Toggle touchpad, exec, $scripts/toggle-touchpad.sh
bindd = , XF86LaunchA, Workspace / window overview, exec, $scripts/windows.sh

# ═══ COSMIC modes ════════════════════════════════════════════════════════
# Swap: SUPER+X, then an arrow / HJKL picks the window to trade places with
submap = swap
bind = , left, swapwindow, l
bind = , left, submap, reset
bind = , down, swapwindow, d
bind = , down, submap, reset
bind = , up, swapwindow, u
bind = , up, submap, reset
bind = , right, swapwindow, r
bind = , right, submap, reset
bind = , H, swapwindow, l
bind = , H, submap, reset
bind = , J, swapwindow, d
bind = , J, submap, reset
bind = , K, swapwindow, u
bind = , K, submap, reset
bind = , L, swapwindow, r
bind = , L, submap, reset
bind = , escape, submap, reset
bind = , Return, submap, reset
submap = reset

# Resize: arrows / HJKL grow, SHIFT+arrows shrink, Esc or Enter to finish
submap = resize
binde = , left, resizeactive, -40 0
binde = , right, resizeactive, 40 0
binde = , up, resizeactive, 0 -40
binde = , down, resizeactive, 0 40
binde = , H, resizeactive, -40 0
binde = , L, resizeactive, 40 0
binde = , K, resizeactive, 0 -40
binde = , J, resizeactive, 0 40
binde = SHIFT, left, resizeactive, 40 0
binde = SHIFT, right, resizeactive, -40 0
binde = SHIFT, up, resizeactive, 0 40
binde = SHIFT, down, resizeactive, 0 -40
bind = , escape, submap, reset
bind = , Return, submap, reset
submap = reset

# ═══ Super Fedora extras (keys COSMIC leaves free) ═══════════════════════
bindd = SUPER, F1, Show all keybindings, exec, $scripts/keybindings.sh
bindd = SUPER, Return, Terminal, exec, $terminal
bindd = SUPER ALT, Space, System menu, exec, $scripts/menu.sh
bindd = CTRL ALT, Delete, Power menu, exec, $scripts/menu.sh system
bindd = SUPER SHIFT, T, Activity monitor (btop), exec, kitty --class floating-term -e btop
bindd = SUPER SHIFT, B, Private browser window, exec, firefox --private-window
bindd = SUPER, P, Pin floating window, pin,
bindd = SUPER, grave, Quake AI drop-down console, exec, $scripts/quake-ai.sh toggle
bindd = SUPER SHIFT, grave, Switch Quake AI agent, exec, $scripts/quake-ai.sh next-agent
bindd = SUPER CTRL, grave, Toggle scratchpad, togglespecialworkspace, scratchpad
bindd = SUPER ALT, Tab, Next tab in stack, changegroupactive, f
bindd = SUPER ALT SHIFT, Tab, Previous tab in stack, changegroupactive, b

# Notifications
bindd = SUPER, N, Dismiss notification, exec, qs ipc call notifications dismiss
bindd = SUPER SHIFT, N, Dismiss all notifications, exec, qs ipc call notifications dismissAll
bindd = SUPER CTRL, N, Toggle do-not-disturb, exec, qs ipc call notifications toggleDnd

# Capture
bindd = SHIFT, Print, Screenshot window, exec, $scripts/screenshot.sh window
bindd = CTRL, Print, Screenshot screen, exec, $scripts/screenshot.sh screen
bindd = SUPER SHIFT, S, Screenshot region, exec, $scripts/screenshot.sh region
bindd = SUPER, Print, Color picker, exec, hyprpicker -a

# Style, settings, session
bindd = SUPER CTRL, Space, Next 16-bit theme, exec, $scripts/wallpaper.sh next
bindd = SUPER CTRL SHIFT, Space, Pick 16-bit theme, exec, $scripts/wallpaper.sh pick
bindd = SUPER CTRL ALT, Space, Toggle dark/light theme, exec, $scripts/wallpaper.sh toggle
bindd = SUPER CTRL, A, Audio settings (wiremix TUI), exec, kitty --class floating-term -e wiremix
bindd = SUPER CTRL, W, Wi-Fi settings (wlctl TUI), exec, kitty --class floating-term -e wlctl
bindd = SUPER CTRL, B, Bluetooth settings (bluetui TUI), exec, kitty --class floating-term -e bluetui
bindd = SUPER, Backspace, Toggle gaps, exec, $scripts/toggle-gaps.sh
bindd = SUPER SHIFT, Space, Toggle top bar, exec, qs ipc call bar toggle
bindd = SUPER ALT, R, Reload Hyprland + bar, exec, hyprctl reload && $scripts/menu.sh restart-shell
bindd = SUPER SHIFT, I, Start IdleScreen now, exec, idlescreen start
bindd = SUPER CTRL, I, Toggle idle (stay awake), exec, $scripts/toggle-idle.sh
bindd = , XF86Calculator, Calculator, exec, gnome-calculator

# ═══ Mouse ═══════════════════════════════════════════════════════════════
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow
bindd = SUPER, mouse_down, Next workspace, workspace, r+1
bindd = SUPER, mouse_up, Previous workspace, workspace, r-1
bindd = SUPER, mouse:276, Next workspace (mouse forward), workspace, r+1
bindd = SUPER, mouse:275, Previous workspace (mouse back), workspace, r-1
bindd = SUPER SHIFT, mouse:276, Move window to next workspace, movetoworkspace, r+1
bindd = SUPER SHIFT, mouse:275, Move window to previous workspace, movetoworkspace, r-1
bindd = SUPER, mouse:274, Close window (middle click), killactive,
