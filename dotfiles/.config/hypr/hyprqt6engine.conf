# SuperFedora Qt6 Theme Provider Configuration (hyprqt6engine)
theme {
    color_scheme = ~/.config/superfedora/qt6-colorscheme.conf
    icon_theme = Adwaita
    style = Fusion
    font = JetBrainsMono Nerd Font
    font_size = 11
    font_fixed = JetBrainsMono Nerd Font
    font_fixed_size = 11
}

misc {
    single_click_activate = false
    menus_have_icons = true
    shortcuts_for_context_menus = true
}
