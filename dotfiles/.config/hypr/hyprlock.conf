# Hyprlock Configuration — Minimal Omarchy Aesthetic

background {
    monitor =
    path = /usr/share/backgrounds/fedora-workstation/flight_dark.webp
    blur_passes = 3
    blur_size = 6
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
}

# Clock
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(205, 214, 244, 1.0)
    font_size = 90
    font_family = JetBrainsMono Nerd Font
    position = 0, 120
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = rgba(166, 173, 200, 1.0)
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, 40
    halign = center
    valign = center
}

# Password Input field
input-field {
    monitor =
    size = 240, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.15
    dots_center = true
    fade_on_empty = false
    font_color = rgb(205, 214, 244)
    inner_color = rgba(26, 27, 38, 0.8)
    outer_color = rgba(122, 162, 247, 0.8)
    check_color = rgb(158, 206, 106)
    fail_color = rgb(247, 118, 142)
    fail_text = <i>Incorrect password</i>
    capslock_color = rgb(224, 175, 104)
    position = 0, -60
    halign = center
    valign = center
}
