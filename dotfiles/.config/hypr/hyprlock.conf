# Hyprlock Configuration — SuperFedora 16-Bit Theme (Electric Cyan / dark / square)
general {
    hide_cursor = false
    ignore_empty_input = true
    immediate_render = true
    fail_timeout = 1200
}
auth {
    pam {
        enabled = true
        module = password-auth
    }
    fingerprint {
        enabled = true
    }
}
animations {
    enabled = false
}
background {
    monitor =
    path = ~/Pictures/Wallpapers/dark/06-electric-cyan.png
    blur_passes = 0
    blur_size = 0
}
label {
    monitor =
    text = <b>󰍹 Screen Off</b>
    color = rgba(205, 214, 244, 1.0)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = -390, -24
    halign = right
    valign = top
    onclick = ~/.config/hypr/scripts/toggle-touchpad.sh dpms off
}
label {
    monitor =
    text = <b>󰤄 Suspend</b>
    color = rgba(205, 214, 244, 1.0)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = -276, -24
    halign = right
    valign = top
    onclick = systemctl suspend
}
label {
    monitor =
    text = <b>󰜉 Restart</b>
    color = rgba(205, 214, 244, 1.0)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = -162, -24
    halign = right
    valign = top
    onclick = systemctl reboot
}
label {
    monitor =
    text = <b>󰐥 Power Off</b>
    color = rgb(f7768e)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = -28, -24
    halign = right
    valign = top
    onclick = systemctl poweroff
}
label {
    monitor =
    text = cmd[update:1000] ~/.local/share/superfedora/lib/session-ctl.sh status
    color = rgb(7dcfff)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = -28, 56
    halign = right
    valign = bottom
    onclick = ~/.local/share/superfedora/lib/session-ctl.sh next
}
label {
    monitor =
    text = <b>󰍃 Switch DE / Log Out</b>
    color = rgba(166, 173, 200, 1.0)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = -28, 28
    halign = right
    valign = bottom
    onclick = ~/.local/share/superfedora/lib/session-ctl.sh switch
}
image {
    monitor =
    path = ~/Pictures/Wallpapers/avatar.jpg
    size = 88
    rounding = 0
    border_size = 2
    border_color = rgb(7dcfff)
    position = 0, 148
    halign = center
    valign = bottom
}
label {
    monitor =
    text = <b>$USER</b>
    color = rgba(205, 214, 244, 1.0)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 108
    halign = center
    valign = bottom
}
input-field {
    monitor =
    size = 290, 44
    outline_thickness = 2
    rounding = 0
    dots_size = 0.26
    dots_spacing = 0.20
    dots_center = true
    fade_on_empty = false
    font_color = rgb(205, 214, 244)
    inner_color = rgba(26, 27, 38, 0.94)
    outer_color = rgb(7dcfff)
    check_color = rgb(9ece6a)
    fail_color = rgb(f7768e)
    fail_text = <b>Incorrect password ($ATTEMPTS)</b>
    capslock_color = rgb(e0af68)
    placeholder_text = Password
    position = 0, 46
    halign = center
    valign = bottom
}
