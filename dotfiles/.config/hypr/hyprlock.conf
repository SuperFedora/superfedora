# Hyprlock Configuration — SuperFedora 16-Bit Theme (Super Blue / dark)
background {
    monitor =
    path = ~/Pictures/Wallpapers/dark/01-super-blue.png
    blur_passes = 0
    blur_size = 0
}
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(205, 214, 244, 1.0)
    font_size = 76
    font_family = JetBrainsMono Nerd Font
    position = 0, -55
    halign = center
    valign = top
}
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = rgba(166, 173, 200, 1.0)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, -150
    halign = center
    valign = top
}
input-field {
    monitor =
    size = 260, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.15
    dots_center = true
    fade_on_empty = false
    font_color = rgb(205, 214, 244)
    inner_color = rgba(26, 27, 38, 0.88)
    outer_color = rgb(#7aa2f7)
    check_color = rgb(#9ece6a)
    fail_color = rgb(#f7768e)
    fail_text = <i>Incorrect password</i>
    capslock_color = rgb(#e0af68)
    position = 0, 90
    halign = center
    valign = bottom
}
