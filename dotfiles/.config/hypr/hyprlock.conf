# Hyprlock Configuration — SuperFedora 16-Bit Theme (Electric Cyan / dark / square)
general {
    hide_cursor = false
    ignore_empty_input = true
    immediate_render = true
    fail_timeout = 1200
}
auth {
    pam {
        enabled = true
        module = password-auth
    }
    fingerprint {
        enabled = true
    }
}
animations {
    enabled = false
}
background {
    monitor =
    path = ~/Pictures/Wallpapers/dark/06-electric-cyan.png
    blur_passes = 0
    blur_size = 0
}
shape {
    monitor =
    size = 42, 42
    color = rgba(26, 27, 38, 0.92)
    rounding = 0
    border_size = 2
    border_color = rgb(7dcfff)
    position = -180, -24
    halign = right
    valign = top
    onclick = hyprctl dispatch dpms off
}
label {
    monitor =
    text = &#160;󰍹&#160;
    color = rgba(205, 214, 244, 1.0)
    font_size = 12
    font_family = JetBrainsMono Nerd Font Mono
    position = -186, -34
    halign = right
    valign = top
    onclick = hyprctl dispatch dpms off
}
shape {
    monitor =
    size = 42, 42
    color = rgba(26, 27, 38, 0.92)
    rounding = 0
    border_size = 2
    border_color = rgb(7dcfff)
    position = -128, -24
    halign = right
    valign = top
    onclick = systemctl suspend
}
label {
    monitor =
    text = &#160;󰤄&#160;
    color = rgba(205, 214, 244, 1.0)
    font_size = 12
    font_family = JetBrainsMono Nerd Font Mono
    position = -134, -34
    halign = right
    valign = top
    onclick = systemctl suspend
}
shape {
    monitor =
    size = 42, 42
    color = rgba(26, 27, 38, 0.92)
    rounding = 0
    border_size = 2
    border_color = rgb(7dcfff)
    position = -76, -24
    halign = right
    valign = top
    onclick = systemctl reboot
}
label {
    monitor =
    text = &#160;󰜉&#160;
    color = rgba(205, 214, 244, 1.0)
    font_size = 12
    font_family = JetBrainsMono Nerd Font Mono
    position = -82, -34
    halign = right
    valign = top
    onclick = systemctl reboot
}
shape {
    monitor =
    size = 42, 42
    color = rgba(26, 27, 38, 0.92)
    rounding = 0
    border_size = 2
    border_color = rgb(f7768e)
    position = -24, -24
    halign = right
    valign = top
    onclick = systemctl poweroff
}
label {
    monitor =
    text = &#160;󰐥&#160;
    color = rgb(f7768e)
    font_size = 12
    font_family = JetBrainsMono Nerd Font Mono
    position = -30, -34
    halign = right
    valign = top
    onclick = systemctl poweroff
}
image {
    monitor =
    path = ~/Pictures/Wallpapers/avatar.jpg
    size = 88
    rounding = 0
    border_size = 2
    border_color = rgb(7dcfff)
    position = 0, 148
    halign = center
    valign = bottom
}
label {
    monitor =
    text = <b>$USER</b>
    color = rgba(205, 214, 244, 1.0)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 108
    halign = center
    valign = bottom
}
input-field {
    monitor =
    size = 290, 44
    outline_thickness = 2
    rounding = 0
    dots_size = 0.26
    dots_spacing = 0.20
    dots_center = true
    fade_on_empty = false
    font_color = rgb(205, 214, 244)
    inner_color = rgba(26, 27, 38, 0.94)
    outer_color = rgb(7dcfff)
    check_color = rgb(9ece6a)
    fail_color = rgb(f7768e)
    fail_text = <b>Incorrect password ($ATTEMPTS)</b>
    capslock_color = rgb(e0af68)
    placeholder_text = Password
    position = 0, 46
    halign = center
    valign = bottom
}
