# Hyprlock Configuration — SuperFedora 16-Bit Theme (Electric Cyan / dark)
general {
    hide_cursor = false
    ignore_empty_input = true
    immediate_render = true
    fail_timeout = 1200
}
animations {
    enabled = false
}
background {
    monitor =
    path = ~/Pictures/Wallpapers/dark/06-electric-cyan.png
    blur_passes = 0
    blur_size = 0
}
shape {
    monitor =
    size = 460, 210
    color = rgba(26, 27, 38, 0.92)
    rounding = 6
    border_size = 2
    border_color = rgb(7dcfff)
    position = 0, 28
    halign = center
    valign = bottom
}
image {
    monitor =
    path = ~/Pictures/Wallpapers/avatar.jpg
    size = 64
    rounding = 6
    border_size = 2
    border_color = rgb(bfeaff)
    position = 0, 156
    halign = center
    valign = bottom
}
label {
    monitor =
    text = <b>$USER</b>  ·  <span foreground="#7dcfff">[SESSION LOCKED]</span>
    color = rgba(205, 214, 244, 1.0)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, 124
    halign = center
    valign = bottom
}
input-field {
    monitor =
    size = 340, 44
    outline_thickness = 2
    rounding = 4
    dots_size = 0.26
    dots_spacing = 0.18
    dots_center = true
    fade_on_empty = false
    font_color = rgb(205, 214, 244)
    inner_color = rgba(26, 27, 38, 0.98)
    outer_color = rgb(7dcfff)
    check_color = rgb(9ece6a)
    fail_color = rgb(f7768e)
    fail_text = <b>AUTH FAILED ($ATTEMPTS) — TRY AGAIN</b>
    capslock_color = rgb(e0af68)
    placeholder_text = <i>Type password to unlock...</i>
    position = 0, 70
    halign = center
    valign = bottom
}
label {
    monitor =
    text = 󰤄 Suspend
    color = rgba(166, 173, 200, 1.0)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = -140, 38
    halign = center
    valign = bottom
    onclick = systemctl suspend
}
label {
    monitor =
    text = 󰍹 Screen Off
    color = rgba(166, 173, 200, 1.0)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = -45, 38
    halign = center
    valign = bottom
    onclick = hyprctl dispatch dpms off
}
label {
    monitor =
    text = 󰜉 Restart
    color = rgba(166, 173, 200, 1.0)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 55, 38
    halign = center
    valign = bottom
    onclick = systemctl reboot
}
label {
    monitor =
    text = 󰐥 Power Off
    color = rgb(f7768e)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 145, 38
    halign = center
    valign = bottom
    onclick = systemctl poweroff
}
