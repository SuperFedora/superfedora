# Hyprland — Omarchy-style layout for Fedora
# Each concern lives in its own file under conf/. Edit those, not this one.
# Reload: SUPER+ALT+R (or `hyprctl reload`). Check errors: `hyprctl configerrors`.

source = ~/.config/hypr/conf/monitors.conf
source = ~/.config/hypr/conf/envs.conf
source = ~/.config/hypr/conf/autostart.conf
source = ~/.config/hypr/conf/input.conf
source = ~/.config/hypr/conf/looknfeel.conf
source = ~/.config/hypr/conf/windows.conf
source = ~/.config/hypr/conf/bindings.conf
