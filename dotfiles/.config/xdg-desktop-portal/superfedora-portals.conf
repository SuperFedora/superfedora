# SuperFedora XDG Desktop Portal Routing (superfedora-portals.conf)
# Routes screen sharing and screenshots to xdg-desktop-portal-hyprland,
# file pickers and dark/light settings to xdg-desktop-portal-gtk,
# and secret storage to gnome-keyring.

[preferred]
default=hyprland;gtk
org.freedesktop.impl.portal.ScreenCast=hyprland
org.freedesktop.impl.portal.Screenshot=hyprland
org.freedesktop.impl.portal.GlobalShortcuts=hyprland
org.freedesktop.impl.portal.FileChooser=gtk
org.freedesktop.impl.portal.Settings=gtk
org.freedesktop.impl.portal.Secret=gnome-keyring
