# SuperFedora login screen: greetd + tuigreet on tty1.
# Hyprland is started through uwsm, which runs it as a systemd user session
# (graphical-session.target, portals and user services come up properly).
# Managed by SuperFedora (system/etc/greetd/config.toml).

[terminal]
vt = 1

[default_session]
command = "tuigreet --time --asterisks --remember --remember-session --theme 'border=blue;title=blue;prompt=blue;time=white;action=blue;button=blue;container=black;input=white' --sessions /usr/share/wayland-sessions --cmd 'uwsm start -e -D Hyprland:SuperFedora hyprland.desktop' --greeting 'SUPER FEDORA'"
user = "greetd"
